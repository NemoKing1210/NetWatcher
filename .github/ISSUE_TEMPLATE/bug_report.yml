name: Bug report
description: Report a problem with NetWatcher
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Do not use this form for
        security vulnerabilities — see SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: NetWatcher version
      description: The release tag or commit you are running.
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 11 23H2 (22631.4169), x64
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior, including the process you were watching.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run as administrator
        2. Select process ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Relevant lines from %LOCALAPPDATA%\NetWatcher\logs (remove anything private).
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am running NetWatcher as administrator.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
