name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NetWatcher.slnx

      - name: Build
        run: dotnet build NetWatcher.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NetWatcher.slnx -c Release --no-build --filter "Category!=RequiresAdmin"

      - name: Format check
        run: dotnet format NetWatcher.slnx --verify-no-changes
